[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pricelab"
version = "0.1.0"
description = "TCG card price forecasting research lab (Prophet / SARIMA / XGBoost / Monte Carlo)"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["pricelab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
